<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田間監測歷史紀錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body data-page="results_history">
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_analyze">ICM分析</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">病蟲害諮詢 ▼</button>
                <div class="dropdown-content">
                    <a href="/consult">病蟲害通報</a>
                    <a href="/diagnosis">病蟲害診斷</a>
                </div>
            </div>
            <div class="dropdown">
                    <a href="/daily_trend">每日變化</a>
            </div>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <div class="content">
        <div class="search-container">
            <h2 class="page-title">環境歷史資料</h2>
            <div class="date-inputs">
                <h3>選擇日期範圍</h3>
                <label for="startDate">開始日期:</label>
                <input type="date" id="startDate">
                
                <label for="endDate">結束日期:</label>
                <input type="date" id="endDate">
    
                <button onclick="fetchData()">顯示圖表</button>
            </div>
        </div>
    
        <div class="chart-container" style="height: 600px; width: 90%;">
            <canvas id="chartMain"></canvas>
        </div>        
    </div>

    <script>
        function fetchData() {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;

            if (!startDate || !endDate) {
                alert("請填寫完整的日期範圍");
                return;
            }

            fetch(`/fetch_results_history?startDate=${startDate}&endDate=${endDate}`)
                .then(res => res.json())
                .then(envData => {
                    // 隨機補上溫濕度資料
                    // envData.ambientTemperature = envData.dates.map(() => parseFloat((Math.random() * 10 + 20).toFixed(1))); // 20~30°C
                    // envData.ambientHumidity = envData.dates.map(() => parseFloat((Math.random() * 40 + 40).toFixed(1)));    // 40~80%

                    renderChart(envData);
                })
                .catch(err => {
                    console.error("資料讀取失敗：", err);
                });
        }

        function renderChart(data) {
            const ctx = document.getElementById("chartMain").getContext("2d");

            if (window.chartMain && typeof window.chartMain.destroy === "function") {
                window.chartMain.destroy();
                window.chartMain = null;
            }

            window.chartMain = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.dates,
                    datasets: [
                        {
                            label: "環境溫度 (°C)",
                            data: data.airTemp,
                            borderColor: "#FF5733",
                            backgroundColor: "#FF5733",
                            yAxisID: "y",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "環境濕度 (%)",
                            data: data.airHumidity,
                            borderColor: "#338AFF",
                            backgroundColor: "#338AFF",
                            yAxisID: "y1",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "大氣壓力 (hPa)",
                            data: data.pressure,
                            borderColor: "#00BFA5",
                            backgroundColor: "#00BFA5",
                            yAxisID: "y3",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "光照度 (lux)",
                            data: data.lux,
                            borderColor: "#FFC300",
                            backgroundColor: "#FFC300",
                            yAxisID: "y2",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "土壤溫度 (°C)",
                            data: data.soilTemp,
                            borderColor: "#8E44AD",
                            backgroundColor: "#8E44AD",
                            yAxisID: "y",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "土壤含水率 (%)",
                            data: data.soilVWC,
                            borderColor: "#3498DB",
                            backgroundColor: "#3498DB",
                            yAxisID: "y1",
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "土壤 EC 值 (dS/m)",
                            data: data.soilEC,
                            borderColor: "#F39C12",
                            backgroundColor: "#F39C12",
                            yAxisID: "y",
                            borderWidth: 2,
                            pointRadius: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'hour',  // ← 改成 hour
                                tooltipFormat: 'yyyy/MM/dd HH:mm',  // 顯示完整日期+時間
                                displayFormats: {
                                    hour: 'MM/dd HH:mm'  // x 軸顯示格式
                                }
                            },
                            title: {
                                display: true,
                                text: "日期時間",
                                font: { size: 16 }
                            },
                            ticks: {
                                autoSkip: true,
                                maxTicksLimit: 10,
                                font: {
                                    size: 14
                                }
                            }
                        },
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: "溫度 / EC",
                                font: { size: 14 }
                            },
                            min: 0
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: "濕度 / 含水率 (%)",
                                font: { size: 14 }
                            },
                            grid: { drawOnChartArea: false },
                            min: 0,
                            max: 100
                        },
                        y2: {
                            type: 'linear',
                            position: 'right',
                            offset: true,
                            title: {
                                display: true,
                                text: "光照度 (lux)",
                                font: { size: 14 }
                            },
                            grid: { drawOnChartArea: false },
                            min: 0,
                            max: 30000
                        },
                        y3: {
                            type: 'linear',
                            position: 'right',
                            offset: true,
                            title: {
                                display: true,
                                text: "大氣壓力 (hPa)",
                                font: { size: 14 }
                            },
                            grid: { drawOnChartArea: false },
                            min: 900,
                            max: 1100
                        }
                    },
                    plugins: {
                        legend: {
                            position: "top",    // 圖例放到圖上方
                            align: "center",    // 水平置中
                            labels: {
                                font: {
                                    size: 16   // 圖例字體大小
                                },
                                padding: 20    // 圖例項目間的距離，讓它不要擠在一起
                            }
                        },
                        tooltip: {
                            bodyFont: {
                                size: 16       // 提示文字也變大一點，使用者看得清楚
                            }
                        }
                    }
                }
            });
        }

        // 確保下拉選單可以展開
        $(document).ready(function () {
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });

    </script>
</body>
</html>
