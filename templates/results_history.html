<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田間監測歷史紀錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body data-page="results_history">
    <div class="navbar">
        <img src="/static/標題圖.png" alt="Logo" class="logo">
        <nav>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">資材管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <div class="dropdown">
                    <a href="/daily_trend">每日變化</a>
            </div>
            <a href="/">登出</a>
        </nav>
    </div>

    <div class="content">
        <div class="search-container">
            <h2 class="page-title">環境歷史資料</h2>
            <div class="date-inputs">
                <h3>選擇日期範圍</h3>
                <label for="startDate">開始日期:</label>
                <input type="date" id="startDate">
                
                <label for="endDate">結束日期:</label>
                <input type="date" id="endDate">
    
                <button onclick="fetchData()">顯示圖表</button>
            </div>
        </div>
    
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        function fetchData() {
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;

            if (!startDate || !endDate) {
                alert("請填寫完整的日期範圍");
                return;
            }

            Promise.all([
                fetch(`/fetch_results_history?startDate=${startDate}&endDate=${endDate}`).then(res => res.json()),
                fetchWeatherData()
            ]).then(([envData, weatherData]) => {
                envData.ambientTemperature = Array(envData.dates.length).fill(weatherData.temperature);
                envData.ambientHumidity = Array(envData.dates.length).fill(weatherData.humidity);

                renderChart(envData);
            }).catch(error => {
                console.error("資料讀取失敗:", error);
            });
        }

        console.log("溫度", data.ambientTemperature);
        console.log("濕度", data.ambientHumidity);

        function renderChart(data) {
            console.log("準備繪製圖表，數據內容：", data);

            const ctx = document.getElementById("myChart").getContext("2d");

            if (window.myChart instanceof Chart) {
                window.myChart.destroy();
            }

            window.myChart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: data.dates,
                    datasets: [
                        {
                            label: "環境溫度 (°C)",
                            data: data.ambientTemperature,
                            borderColor: "#FF5733",
                            yAxisID: "y", // 左側 Y 軸
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "環境濕度 (%)",
                            data: data.ambientHumidity,
                            borderColor: "#338AFF",
                            yAxisID: "y", // 左側 Y 軸
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "土壤 EC 值 (dS/m)",
                            data: data.ecValue,
                            borderColor: "#8D33FF",
                            yAxisID: "y", // 左側 Y 軸
                            borderWidth: 2,
                            pointRadius: 3
                        },
                        {
                            label: "光照度 (lux)",
                            data: data.illumination,
                            borderColor: "#FFA500",
                            yAxisID: "y2",  // 右側 Y 軸
                            borderWidth: 2,
                            pointRadius: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: "日期時間",
                                font: { size: 16 }
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 30
                            }
                        },
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: "數值",
                                font: { size: 14 }
                            }
                        },
                        y2: {
                            type: 'linear',
                            position: 'right',
                            title: {
                                display: true,
                                text: "光照度 (lux)",
                                font: { size: 14 }
                            },
                            min: 0,   // ✅ 強制從 0 開始
                            max: 100,  // ✅ 可以根據溫濕度值設為 100，避免太小看不到
                            grid: {
                                drawOnChartArea: false  // 不畫右軸的格線，避免雜亂
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: "top"
                        }
                    }
                }
            });
        }

        // 確保下拉選單可以展開
        $(document).ready(function () {
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });

        async function fetchWeatherData() {
            try {
                let response = await fetch(
                    "https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-035?Authorization=CWA-233147B7-C268-43C1-BC20-C819EE149C00&format=JSON&LocationName=內埔鄉&ElementName=平均溫度,平均相對濕度"
                );

                let data = await response.json();

                let locations = data.records.Locations;
                let locationData = locations[0].Location.find(loc => loc.LocationName === "內埔鄉");
                let elements = locationData.WeatherElement;

                let tempElement = elements.find(e => e.ElementName === "平均溫度");
                let humidityElement = elements.find(e => e.ElementName === "平均相對濕度");

                let temp = tempElement.Time[0].ElementValue[0].Value;
                let humidity = humidityElement.Time[0].ElementValue[0].Value;

                return { temperature: parseFloat(temp), humidity: parseFloat(humidity) };
            } catch (error) {
                console.error("氣象 API 失敗：", error);
                return { temperature: 25, humidity: 60 };
            }
        }

    </script>
</body>
</html>
