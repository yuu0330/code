<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>場域串流</title>
    <link rel="stylesheet" href="/static/material.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body data-page="video">
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_analyze">ICM分析</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <a href="/daily_trend">每日變化</a>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>
    <div class="stream-container">
        <h2>場域串流</h2>
        <!-- 改為新的串流 URL，並加入網路連線檢測 -->
        <!-- <img id="streamImage" src="http://pi5ca.ddns.net:5000/api/stream" alt="樹梅派影像串流" width="800" height="600"> -->
        <img id="stream_redirect" src="http://192.168.178.153:5000/api/stream" alt="樹梅派影像串流" width="800" height="600">
    </div>
    <script>
        $(document).ready(function () {
            // 導覽展開功能
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });

            // 重新連線檢查功能
            function checkStreamConnection() {
                const imgElement = $("#stream_redirect");
                imgElement.on("error", function () {
                    setTimeout(function () {
                        imgElement.attr("src", "http://192.168.178.153:5000/api/stream");
                    }, 5000); // 每 5 秒重新嘗試連線
                });
            }
            checkStreamConnection();
        });
    </script>    
</body>
</html>
