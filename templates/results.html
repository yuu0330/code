<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>田間監測</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body data-page="results">

    <!-- 導覽列 -->
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_analyze">ICM分析</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <a href="/daily_trend">每日變化</a>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>
    <div class="content">
        <h2 class="page-title">場域環境監測</h2>

        <!-- 環境與土壤數據：上排4個，下排4個 -->
        <div class="gauge-container">
            <div class="gauge-box" id="gaugeEnvTemp"></div>
            <div class="gauge-box" id="gaugeEnvHumidity"></div>
            <div class="gauge-box" id="gaugePressure"></div>
            <div class="gauge-box" id="gaugeRain"></div>
        </div>

        <div class="gauge-container">
            <div class="gauge-box" id="gaugeSoilTemp"></div>
            <div class="gauge-box" id="gaugeSoilMoisture"></div>
            <div class="gauge-box" id="gaugeSoilEC"></div>
        </div>
    </div>

    <script>
        async function fetchWeatherData() {
            try {
                let response = await fetch("/weather_proxy");
                let data = await response.json();
                return { temperature: data.temperature, humidity: data.humidity };
            } catch (error) {
                return { temperature: 25, humidity: 60 };
            }
        }

        async function fetchFirebaseSoilData() {
            try {
                const response = await fetch("https://environmentdata-52a5e-default-rtdb.firebaseio.com/test/data.json");
                const rawData = await response.json();
                const entries = Object.entries(rawData || {});

                if (entries.length === 0) throw new Error("空資料");

                // 取得最新的資料
                const latestData = entries[entries.length - 1][1];

                // 顯示從 Firebase 取得的資料（用於調試）
                console.log("[Firebase 最新資料]:", latestData);

                return {
                    pressure: parseFloat(latestData.pressure) || 995.6,  // 默認值 1000
                    rainfall: parseFloat(latestData.illumination) || 880.8,  // 默認值 12000
                    soilTemperature: parseFloat(latestData.soil_temperature) || 27.3,
                    soilMoisture: parseFloat(latestData.soil_moisture || 0) || 40,
                    soilEC: parseFloat(latestData.ec) || 1
                };
            } catch (error) {
                console.error("[Firebase 抓取錯誤]：", error);
                return {    //可以填假資料
                    pressure: 995.6,
                    rainfall: 880.8,
                    soilTemperature: 27.3,
                    soilMoisture: 40,
                    soilEC: 0.05
                };
            }
        }

        function createGauge(value, title, range, colors) {
            return {
                type: "indicator",
                mode: "gauge+number",
                value: value,
                title: {
                    text: title,
                    font: { size: 20 },
                    align: "center",
                },
                number: {
                    font: { size: 28 },
                    valueformat: ".0f"
                },
                gauge: {
                    shape: "semi",
                    axis: {
                        range: range,
                        tickwidth: 1,
                        ticklen: 2,
                        tickcolor: "black",
                        tickfont: { size: 10 }
                    },
                    bar: { color: "darkblue", thickness: 0.3 },
                    steps: colors.map(c => ({ range: [c[0], c[1]], color: c[2] })),
                    threshold: {
                        line: { color: "darkblue", width: 4 },
                        thickness: 0.8,
                        value: value
                    }
                },
                domain: { x: [0, 1], y: [0, 1] }
            };
        }

        const gaugeLayout = {
            width: 300,
            height: 300,
            margin: { t: 30, b: 0, l: 40, r: 40 },
            paper_bgcolor: "white",
            plot_bgcolor: "white",
        };

        const gaugeConfig = { responsive: true, displayModeBar: false, useResizeHandler: true };

        async function updateGauges() {
            const weather = await fetchWeatherData();
            const firebaseData = await fetchFirebaseSoilData();
            console.log("[從 Firebase 抓取到的資料]:", firebaseData);
            if (!firebaseData) return;

            // 設定每個資料欄位
            const pressure = firebaseData.pressure;
            const illumination = firebaseData.rainfall;
            const soilTemp = firebaseData.soilTemperature;
            const soilMoisture = firebaseData.soilMoisture;
            const soilEC = firebaseData.soilEC;

            // 顯示調試資訊，檢查是否有正確獲取數據
            console.log("[顯示 Firebase 資料]:", firebaseData);

            // 更新每個儀表圖
            Plotly.newPlot("gaugeEnvTemp", [createGauge(weather.temperature, "環境溫度 (°C)", [0, 50], [[0, 10, "#4CAF50"], [10, 20, "#00BCD4"], [20, 30, "#FFC107"], [30, 50, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugeEnvHumidity", [createGauge(weather.humidity, "環境濕度 (%)", [0, 100], [[0, 25, "#4CAF50"], [25, 50, "#00BCD4"], [50, 75, "#FFC107"], [75, 100, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugePressure", [createGauge(pressure, "大氣壓力 (hPa)", [980, 1020], [[980, 990, "#4CAF50"], [990, 1005, "#FFC107"], [1005, 1020, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugeRain", [createGauge(illumination, "光照度 (lux)", [0, 30000], [[0, 5000, "#4CAF50"], [5000, 15000, "#FFC107"], [15000, 30000, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugeSoilTemp", [createGauge(soilTemp, "土壤溫度 (°C)", [0, 40], [[0, 10, "#4CAF50"], [10, 20, "#00BCD4"], [20, 30, "#FFC107"], [30, 40, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugeSoilMoisture", [createGauge(soilMoisture, "土壤濕度 (%)", [0, 100], [[0, 25, "#4CAF50"], [25, 50, "#00BCD4"], [50, 75, "#FFC107"], [75, 100, "#F44336"]])], gaugeLayout, gaugeConfig);
            Plotly.newPlot("gaugeSoilEC", [createGauge(soilEC, "土壤EC值 (mmhos/cm)", [0.5, 3.5], [[0.5, 1.5, "#4CAF50"], [1.5, 2.5, "#FFC107"], [2.5, 3.5, "#F44336"]])], gaugeLayout, gaugeConfig);
        }

        // 每30秒更新一次
        updateGauges();
        setInterval(updateGauges, 30000);

        $(document).ready(function () {
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    </script>
</body>
</html>
