        function logout() {
            $.get("/logout", function(response) {
                sessionStorage.clear();
                updateNavBar(null);
                window.location.href = "/";
            });
        }

        function updateNavBar(username) {
            if (username) {
                $("#loginContainer, #registerContainer").hide();
                $("#welcomeContainer").show();
                $("#loginNav").addClass("hidden");         // 登入按鈕隱藏
                $("#logoutButton").removeClass("hidden");  // 顯示登出
                $("#degreeOption, #resultsOption, #historyOption").removeClass("hidden");
            } else {
                $("#loginContainer").show();
                $("#welcomeContainer").hide();
                $("#loginNav").removeClass("hidden");      // 顯示登入
                $("#logoutButton").addClass("hidden");     // 隱藏登出
                $("#degreeOption, #resultsOption, #historyOption").addClass("hidden");
            }
        }

        function checkLoginStatus() {
            let isLoggedIn = sessionStorage.getItem("isLoggedIn");
            let username = sessionStorage.getItem("username");
            if (isLoggedIn === "true" && username) {
                updateNavBar(username);
            }
        }
