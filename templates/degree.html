<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病蟲害偵測</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body data-page="degree">
    <!-- 左側導覽列 -->
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/wingbeat_analysis">振翅頻率分析</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_analyze">ICM分析</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <div class="dropdown">
                    <a href="/daily_trend">每日變化</a>
            </div>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <!-- 內容區塊 -->
    <div class="content">
        <h2 class="page-title">多模態 AI 害蟲監測</h2>

        <!--日期查詢區塊 -->
        <div class="date-query">
            <label for="startDate">日期查詢：</label>
            <input type="date" id="startDate">
            <span>~</span>
            <input type="date" id="endDate">
            <button class="query-btn" onclick="fetchPestData()">查詢</button>
            <button class="clear-btn" onclick="clearDate()">清除</button>
        </div>

        <!-- 害蟲總數量 & 裝置編號 -->
        <div class="summary">
            <p>
                <strong id="totalPestsLabel">今日害蟲總數量：</strong>
                <span id="totalPests">載入中...</span> 隻
            </p>              
            <p><strong>裝置編號：</strong> A1</p>
        </div>

        <!-- 病蟲害監測視覺化圖表 -->
        <div class="gauge-container">
            <div class="chart-box" id="pestCountGauge"></div>
            <div class="chart-box" id="wingbeatWaveform"></div>
            <div class="chart-box">
                <img id="yoloStream" src="/detect_pests">
            </div>
        </div>
    </div>

    <script>
        // 統一儀表圖繪製函數
        function drawUnifiedGauge(id, value, title, range, steps, color) {
            const data = [{
                type: "indicator",
                mode: "gauge+number",
                value: value,
                number: {
                    font: { size: 50, color: color || "#333" }
                },
                title: {
                    text: `<b>${title}</b>`,
                    font: { size: 20 },
                    align: "center"
                },
                gauge: {
                    axis: {
                        range: range,
                        tickwidth: 2,
                        tickcolor: "#999",
                        tickfont: { size: 20 }
                    },
                    bar: { color: "black", thickness: 0.3 },
                    bgcolor: "white",
                    borderwidth: 2,
                    bordercolor: "#e0e0e0",
                    steps: steps,
                    threshold: {
                        line: { color: "black", width: 5 },
                        thickness: 0.5,
                        value: value
                    }
                }
            }];
    
            const layout = {
                width: 400,
                height: 320,
                margin: { t: 40, b: 40, l: 20, r: 20 },
                paper_bgcolor: "#fff",
                font: { family: "Arial, sans-serif", color: "#333" }
            };
            
            Plotly.newPlot(id, data, layout);
        }
    
        // 取得今日日期（YYYY-MM-DD 格式）
        function getTodayDate() {
            let today = new Date();
            return today.toISOString().split("T")[0];
        }
    
        // 查詢害蟲總數（根據日期）
        function fetchPestData() {
            const startDate = $("#startDate").val();
            const endDate = $("#endDate").val();

            let url = "/ir_count_today";  // 預設查今日
            if (startDate && endDate) {
                url = `/ir_count_range?startDate=${startDate}&endDate=${endDate}`;
            }

            $.get(url, function(data) {
                const totalPests = data.total_count || data.count || 0;
                const label = (startDate && endDate) ? "查詢區間總數量：" : "今日害蟲總數量：";
                $("#totalPests").text(totalPests);
                $("#totalPestsLabel").text(label);

                if (startDate && endDate) {
                    $("#rangeCount").text(totalPests);
                } else {
                    $("#rangeCount").text("--");
                }

                let levelText = "安全等級（16 隻以下）";
                let color = "#4CAF50";
                if (totalPests > 256) { color = "#F44336"; levelText = "嚴重爆發（256 隻以上）"; }
                else if (totalPests > 64) { color = "#FFC107"; levelText = "需加強管理（64–256 隻）"; }
                else if (totalPests > 16) { color = "#1E90FF"; levelText = "監測提醒（16–64 隻）"; }

                drawUnifiedGauge("pestCountGauge", totalPests,
                    `病蟲害數量<br><span style='font-size:16px;color:gray;'>${levelText}</span>`,
                    [0, 300],
                    [
                        { range: [0, 16], color: "#4CAF50" },
                        { range: [16, 64], color: "#1E90FF" },
                        { range: [64, 256], color: "#FFC107" },
                        { range: [256, 300], color: "#F44336" }
                    ],
                    color
                );
            });
        }


        // 清除按鈕 - 只清除日期，但害蟲總數量仍顯示今日數據
        function clearDate() {
            $("#startDate").val('');
            $("#endDate").val('');
            fetchPestData(true); // 重新載入今日害蟲數量
        }
    
        // 動態生成振翅波形圖
        function updateWingbeatWaveform() {
            const frequency = Math.random() * 100 + 20;
            const sampleRate = 1000;
            const duration = 0.02;
            const time = [];
            const waveform = [];
    
            for (let i = 0; i < sampleRate * duration; i++) {
                let t = i / sampleRate;
                time.push(t);
                waveform.push(Math.sin(2 * Math.PI * frequency * t));
            }
    
            const trace = {
                x: time,
                y: waveform,
                type: 'scatter',
                mode: 'lines',
                line: { color: 'blue' }
            };
    
            const layout = {
                title: `振翅波形 (${Math.round(frequency)}Hz)`,
                width: 400,
                height: 350,
                xaxis: { title: "Time [s]" },
                yaxis: { title: "Amplitude" },
                showlegend: false
            };
    
            Plotly.newPlot('wingbeatWaveform', [trace], layout);
        }
    
        // 初始化與週期執行
        $(document).ready(function () {
            fetchPestData(true);
            updateWingbeatWaveform();
            setInterval(updateWingbeatWaveform, 5000);
            setInterval(fetchPestData, 30000);
    
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });
    
            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    
        // 登出功能
        function logout() {
            $.get("/logout", function() {
                window.location.href = "/";
            });
        }
    </script>
    
</body>
</html>
