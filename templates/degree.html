        // 統一儀表圖繪製函數
        function drawUnifiedGauge(id, value, title, range, steps, color) {
    const data = [{
        type: "indicator",
        mode: "gauge+number",
        value: value,
        number: {
            font: { size: 50, color: color || "#333" }
        },
        title: {
            text: `<b>${title}</b>`,
            font: { size: 20 },
            align: "center"
        },
        gauge: {
            axis: {
                range: range,
                tickwidth: 2,
                tickcolor: "#999",
                tickfont: { size: 20 }
            },
            bar: { color: "black", thickness: 0.3 },
            bgcolor: "white",
            borderwidth: 2,
            bordercolor: "#e0e0e0",
            steps: steps,
            threshold: {
                line: { color: "black", width: 5 },
                thickness: 0.5,
                value: value
            }
        }
    }];
    
    const layout = {
        width: 400,
        height: 320,
        margin: { t: 40, b: 40, l: 20, r: 20 },
        paper_bgcolor: "#fff",
        font: { family: "Arial, sans-serif", color: "#333" }
    };
    
    Plotly.newPlot(id, data, layout);
}

        // 這裡隨機生成 1 到 20 隻害蟲數量
        function fetchPestData() {
    const startDate = $("#startDate").val();
    const endDate = $("#endDate").val();

    // 隨機生成害蟲數量
    const totalPests = Math.floor(Math.random() * 20) + 1;
    console.log("[Debug] 隨機生成的害蟲數量：", totalPests);  // 確保數據正確生成

    // 更新 UI 顯示
    $("#totalPests").text(totalPests); 
    $("#totalPestsLabel").text((startDate && endDate) ? "查詢區間總數量：" : "今日害蟲總數量：");

    // 清除舊的儀表圖
    $("#pestCountGauge").empty();  

    let levelText = "安全等級（16 隻以下）";
    let color = "#4CAF50";
    if (totalPests > 256) { color = "#F44336"; levelText = "嚴重爆發（256 隻以上）"; }
    else if (totalPests > 64) { color = "#FFC107"; levelText = "需加強管理（64–256 隻）"; }
    else if (totalPests > 16) { color = "#1E90FF"; levelText = "監測提醒（16–64 隻）"; }

    drawUnifiedGauge("pestCountGauge", totalPests,
        `病蟲害數量<br><span style='font-size:16px;color:gray;'>${levelText}</span>`,
        [0, 300],
        [
            { range: [0, 16], color: "#4CAF50" },
            { range: [16, 64], color: "#1E90FF" },
            { range: [64, 256], color: "#FFC107" },
            { range: [256, 300], color: "#F44336" }
        ],
        color
    );
}

        // 隨機振翅波形圖
let hasAnalyzed = false;

function updateWingbeatData() {
    const sec = Math.floor(Date.now() / 1000) % 5;
    const t = new Date().getTime();

    // 隨機生成波型數據
    const sampleRate = 1000;  // 取樣率
    const duration = 0.02;    // 時間範圍
    const frequency = Math.random() * 100 + 20;  // 隨機生成 20Hz 到 120Hz 之間的頻率
    const time = [];
    const waveform = [];

    // 生成隨機的波型
    for (let i = 0; i < sampleRate * duration; i++) {
        let t = i / sampleRate;
        time.push(t);
        waveform.push(Math.sin(2 * Math.PI * frequency * t));  // 使用正弦波模擬振翅波型
    }

    // 更新圖表
    const trace = {
        x: time,
        y: waveform,
        type: 'scatter',
        mode: 'lines',
        line: { color: 'blue' }
    };

    const layout = {
        width: 400,
        height: 350,
        xaxis: { title: "Time [s]" },
        yaxis: { title: "Amplitude" },
        showlegend: false
    };

    Plotly.newPlot('wingbeatWaveform', [trace], layout);

    // 更新振翅次數
    const wingbeatCount = Math.floor(Math.random() * 20) + 1;  // 隨機生成 1 到 20 次
    const estimatedNum = Math.round(wingbeatCount / 20);  // 根據次數估算害蟲數量
    $("#wingbeatCount").text(`${wingbeatCount} 次`);
    $("#wingbeatEstimate").text(`${estimatedNum}`);
}
