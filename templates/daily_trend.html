<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病蟲害偵測</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body data-page="daily_trend">
    <!-- 左側導覽列 -->
    <div class="navbar">
        <a href="/degree">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>        
        <nav>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>

            <div class="dropdown">
                <a href="/daily_trend">每日變化</a>
            </div>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <!-- 主內容區 -->
    <div class="content">
        <h2 class="page-title">每日變化趨勢分析</h2>
        <div class="daily-chart-wrapper">
            <h2>每 2 小時溫度變化</h2>
            <div id="temperatureChart"></div>
        </div>

        <div class="daily-chart-wrapper">
            <h2>每 2 小時蟲數變化</h2>
            <div id="pestChart"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $.get("/fetch_daily_trend", function (data) {
                const sortedTemperature = data.temperature.sort((a, b) => new Date(a[0]) - new Date(b[0]));
                const sortedPests = data.pests.sort((a, b) => new Date(a[0]) - new Date(b[0]));

                const times = sortedTemperature.map(item => item[0]); // 時間 ISO 字串
                const temperatures = sortedTemperature.map(item => item[1]);
                const pestCounts = sortedPests.map(item => item[1]);

                const tickvals = [];
                const ticktexts = [];

                times.forEach((timeStr, index) => {
                    const date = new Date(timeStr);
                    const hour = date.getHours().toString().padStart(2, '0');
                    const minute = date.getMinutes().toString().padStart(2, '0');

                    // 只顯示 00:00，或每 3 筆顯示一筆
                    if ((hour === '00' && minute === '00') || index % 3 === 0) {
                        tickvals.push(timeStr);

                        if (hour === '00' && minute === '00') {
                            const month = (date.getMonth() + 1).toString().padStart(2, '0');
                            const day = date.getDate().toString().padStart(2, '0');
                            ticktexts.push(`${month}/${day} ${hour}:${minute}`);
                        } else {
                            ticktexts.push(`${hour}:${minute}`);
                        }
                    }
                });

                const tempTrace = {
                    x: times,
                    y: temperatures,
                    type: 'bar',
                    marker: { color: 'red' },
                    name: '溫度 (°C)'
                };

                const pestTrace = {
                    x: times,
                    y: pestCounts,
                    type: 'bar',
                    marker: { color: 'green' },
                    name: '蟲數'
                };

                Plotly.newPlot("temperatureChart", [tempTrace], {
                    xaxis: {
                        title: "時間",
                        tickvals: tickvals,
                        ticktext: ticktexts,
                        automargin: true
                    },
                    yaxis: { title: "溫度 (°C)" },
                    margin: { t: 40 },
                    width: 900,
                    height: 400
                });

                Plotly.newPlot("pestChart", [pestTrace], {
                    xaxis: {
                        title: "時間",
                        tickvals: tickvals,
                        ticktext: ticktexts,
                        automargin: true
                    },
                    yaxis: { title: "蟲數" },
                    margin: { t: 40 },
                    width: 900,
                    height: 400
                });
            });

            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    </script>
</body>
</html>
