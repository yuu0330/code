    <div class="content">
        <h2 class="page-title">每日變化趨勢分析</h2>
        <div class="daily-chart-wrapper">
            <h2>溫度與蟲數關係圖</h2>
            <div id="combinedChart"></div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $.get("/fetch_daily_trend", function (data) {
                const sortedTemperature = data.temperature.sort((a, b) => new Date(a[0]) - new Date(b[0]));
                const sortedPests = data.pests.sort((a, b) => new Date(a[0]) - new Date(b[0]));

                const times = sortedTemperature.map(item => item[0]);
                const temperatures = sortedTemperature.map(item => item[1]);
                const pestCounts = sortedPests.map(item => item[1]);

                const tempTrace = {
                    x: times,
                    y: temperatures,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: '溫度 (°C)',
                    yaxis: 'y1',
                    line: { color: 'red' }
                };

                const pestTrace = {
                    x: times,
                    y: pestCounts,
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: '蟲數',
                    yaxis: 'y2',
                    line: { color: 'green' }
                };

                const layout = {
                    xaxis: { title: '時間', automargin: true },
                    yaxis: { title: '溫度 (°C)', side: 'left' },
                    yaxis2: {
                        title: '蟲數',
                        overlaying: 'y',
                        side: 'right'
                    },
                    legend: { x: 0, y: 1.1, orientation: 'h' },
                    margin: { t: 40 },
                    height: 450,
                    responsive: true
                };

                Plotly.newPlot("combinedChart", [tempTrace, pestTrace], layout);
            });

            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    </script>
