<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資材管理</title>
    <link rel="stylesheet" href="/static/material.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="/degree">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">資材管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <a href="/daily_trend">每日變化</a>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <div class="content">
        <h2>農業資材-蟲害防治藥劑</h2>
        <form id="materialForm">
            <label for="name">農藥名稱：</label>
            <input type="text" id="name" name="name" required>

            <label for="time">使用時間：</label>
            <input type="datetime-local" id="time" name="time" required>

            <label for="place">使用地點：</label>
            <input type="text" id="place" name="place" required>

            <label for="use">用途：</label>
            <input type="text" id="use" name="use" required>
            
            <div id="dynamicFields"></div>

            <div class="add-buttons">
                <button type="button" class="small-btn" id="addAdjust">＋ 新增調劑</button>
                <button type="button" class="small-btn" id="addFertilizer">＋ 新增肥料</button>
            </div>
            
            <div class="submit-wrapper">
                <button type="submit">提交</button>
            </div>
        </form>
    </div>

    <script>
        $(document).ready(function () {
            // 表單送出處理（保留原本）
            $("#materialForm").submit(function (event) {
                event.preventDefault();
                
                let formData = {
                    name: $("#name").val(),
                    time: $("#time").val(),
                    place: $("#place").val(),
                    use: $("#use").val(),
                    adjust: $("#adjust").val() || "",
                    fertilizer: $("#fertilizer").val() || ""
                };

                $.post("/submit_material", formData, function (response) {
                    alert(response.message);
                    $("#materialForm")[0].reset();
                    $("#dynamicFields").empty(); // 清空動態欄位
                });
            });

            // 新增調劑欄位
            $("#addAdjust").click(function () {
                if (!$("#adjust").length) {
                    $("#dynamicFields").append(`
                        <label for="adjust">調劑內容：</label>
                        <input type="text" id="adjust" name="adjust">
                    `);
                }
            });

            // 新增肥料欄位
            $("#addFertilizer").click(function () {
                if (!$("#fertilizer").length) {
                    $("#dynamicFields").append(`
                        <label for="fertilizer">肥料內容：</label>
                        <input type="text" id="fertilizer" name="fertilizer">
                    `);
                }
            });

            // 下拉選單展開功能（保留原本）
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });

    </script>
</body>
</html>
