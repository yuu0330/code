<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資材管理</title>
    <link rel="stylesheet" href="/static/material.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="navbar">
        <a href="/degree">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <a href="/daily_trend">每日變化</a>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <div class="content">
        <h2>農業資材-蟲害防治藥劑</h2>
        <form id="materialForm">
            <label for="name">填表人：</label>
            <select id="name" name="name" required onchange="toggleNameOther(this)">
                <option value="" disabled selected>請選擇填表人</option>
                <option value="勇銓">勇銓</option>
                <option value="啟彰">啟彰</option>
                <option value="慎之助">慎之助</option>
                <option value="亭葦">亭葦</option>
                <option value="誠邑">誠邑</option>
                <option value="浩宇">浩宇</option>
                <option value="玉慧">玉慧</option>
                <option value="其他">其他</option>
            </select>
            <input type="text" id="nameOther" name="nameOther" placeholder="請輸入填表人姓名" style="display: none; margin-top: 10px;">
            
            <label for="time">使用時間：</label>
            <input type="datetime-local" id="time" name="time" required>

            <label for="place">使用地點：</label>
            <select id="place" name="place" required onchange="toggleOtherInput(this)">
                <option value="" disabled selected>請選擇使用地點</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="右區">右區</option>
                <option value="黃金果區F1">黃金果區F1</option>
                <option value="綜合果樹區F2">綜合果樹區F2</option>
                <option value="G1溫室1">G1溫室1</option>
                <option value="G2溫室2">G2溫室2</option>
                <option value="G3溫室3">G3溫室3</option>
                <option value="育苗區">育苗區</option>
                <option value="資材室或工具室">資材室或工具室</option>
                <option value="加工室(廚房或教室)">加工室(廚房或教室)</option>
                <option value="其他">其他</option>
            </select>
            <input type="text" id="placeOther" name="placeOther" placeholder="請輸入其他地點" style="display:none; margin-top: 10px;">
            
            <label for="material">病蟲害防治資材：</label>
            <select id="material" name="material" required onchange="toggleMaterialOther(this)">
                <option value="" disabled selected>請選擇資材名稱</option>
                <option value="無施用">無施用</option>
                <option value="葵無露">葵無露</option>
                <option value="亞磷酸鉀">亞磷酸鉀</option>
                <option value="木醋液">木醋液</option>
                <option value="苦楝油">苦楝油</option>
                <option value="苦茶粕">苦茶粕</option>
                <option value="硫磺合劑">硫磺合劑</option>
                <option value="波爾多液">波爾多液</option>
                <option value="蘇力菌">蘇力菌</option>
                <option value="其他">其他</option>
            </select>
            <input type="text" id="materialOther" name="materialOther" placeholder="請輸入其他資材名稱" style="display: none; margin-top: 10px;">
            
            <label for="fertilizer">施用的肥料或益生菌：</label>
            <select id="fertilizer" name="fertilizer" required onchange="toggleFertilizerOther(this)">
                <option value="" disabled selected>請選擇肥料名稱</option>
                <option value="無施用">無施用</option>
                <option value="市售有機堆肥">市售有機堆肥</option>
                <option value="發酵過雞糞或鴨糞">發酵過雞糞或鴨糞</option>
                <option value="自製液肥(農業廢棄物)">自製液肥(農業廢棄物)</option>
                <option value="光合菌">光合菌</option>
                <option value="治黃葉(噴粉芽孢桿菌)">治黃葉(噴粉芽孢桿菌)</option>
                <option value="健達力蘇力菌">健達力蘇力菌</option>
                <option value="菌根菌">菌根菌</option>
                <option value="其他">其他</option>
            </select>
            <input type="text" id="fertilizerOther" name="fertilizerOther" placeholder="請輸入其他肥料名稱" style="display: none; margin-top: 10px;">
                
            <div id="dynamicFields"></div>

            <!-- 新增劑量欄位按鈕 -->
            <div class="add-buttons">
                <button type="button" class="small-btn" id="addMaterialDose">＋ 新增資材劑量</button>
                <button type="button" class="small-btn" id="addFertilizerDose">＋ 新增肥料劑量</button>
            </div>
            
            <div class="submit-wrapper">
                <div class="button-row">
                    <button type="submit" id="submitBtn">提交</button>
                    <button type="button" id="clearForm">清除</button>
                </div>
            </div>                                 
        </form>
    </div>

    <script>
        $(document).ready(function () {
        // 提交處理
        $("#materialForm").submit(function (event) {
                event.preventDefault();

                let formData = {
                    name: ($("#name").val() === "其他" ? $("#nameOther").val() : $("#name").val()),
                    time: $("#time").val(),
                    place: ($("#place").val() === "其他" ? $("#placeOther").val() : $("#place").val()),
                    material: ($("#material").val() === "其他" ? $("#materialOther").val() : $("#material").val()),
                    fertilizer: ($("#fertilizer").val() === "其他" ? $("#fertilizerOther").val() : $("#fertilizer").val()),
                    materialDose: $("#materialDose").val() || "",
                    fertilizerDose: $("#fertilizerDose").val() || ""
                };

                $.post("/submit_material", formData, function (response) {
                    alert(response.message);
                    clearForm(); // 成功後清除欄位
                });
            });

            // 點擊清除按鈕時觸發
            $("#clearForm").click(function () {
                clearForm();
            });

            // 封裝清除所有欄位的函式
            function clearForm() {
                $("#materialForm")[0].reset();
                $("#dynamicFields").empty();
                $("#nameOther").val("").hide();
                $("#placeOther").val("").hide();
                $("#materialOther").val("").hide();
                $("#fertilizerOther").val("").hide();
                $("#material").val("");
                $("#fertilizer").val("");
            }

            // 新增資材劑量欄位
            $("#addMaterialDose").click(function () {
                if (!$("#materialDose").length) {
                    $("#dynamicFields").append(`
                        <label for="materialDose">資材劑量：</label>
                        <input type="text" id="materialDose" name="materialDose">
                    `);
                }
            });

            // 新增肥料劑量欄位
            $("#addFertilizerDose").click(function () {
                if (!$("#fertilizerDose").length) {
                    $("#dynamicFields").append(`
                        <label for="fertilizerDose">肥料劑量：</label>
                        <input type="text" id="fertilizerDose" name="fertilizerDose">
                    `);
                }
            });

            // 下拉選單展開功能（保留原本）
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
        function toggleOtherInput(select) {
            if (select.value === "其他") {
                $("#placeOther").show();
            } else {
                $("#placeOther").hide();
            }
            if (select.value === "其他") {
                $("#nameOther").show();
            } else {
                $("#nameOther").hide();
            }
            if (select.value === "其他") {
                $("#materialOther").show();
            } else {
                $("#materialOther").hide();
            }
            if (select.value === "其他") {
                $("#fertilizerOther").show();
            } else {
                $("#fertilizerOther").hide();
            }
            $("#materialDose").val("");
            $("#fertilizerDose").val("");
        }
    </script>
</body>
</html>
