  <script>
    $(document).ready(function () {
      // 表單送出
      $("#materialForm").submit(function (event) {
        event.preventDefault();
        let formData = {
          name: ($("#name").val() === "其他" ? $("#nameOther").val() : $("#name").val()),
          time: $("#time").val(),
          place: getCheckedValues("place[]", "placeOther"),
          crops: getCheckedValues("crop[]", "cropOther"),
          items: getCheckedValues("items[]", "itemsOther"),  // ★ 加這行
          material: getCheckedValues("material[]", "materialOther"),
          fertilizer: getCheckedValues("fertilizer[]", "fertilizerOther")
        };
        console.log("[Debug] 送出資料：", formData);
    
        $.ajax({
          url: "/submit_material",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify(formData),
          success: function (response) {
            alert(response.message || "提交成功！");
            clearForm();
          },
          error: function (xhr, status, error) {
            alert("提交失敗：" + (xhr.responseJSON?.message || error));
          }
        });
      });
    
      // 勾選"其他"顯示輸入欄位
      function bindOtherCheckbox(groupName, wrapperId) {
        $("input[name='" + groupName + "']").change(function () {
          if ($(this).val() === "其他" && $(this).is(":checked")) {
            $("#" + wrapperId).show();
          } else if ($(this).val() === "其他" && !$(this).is(":checked")) {
            $("#" + wrapperId).hide().find("input").val("");
          }
        });
      }
      bindOtherCheckbox("place[]", "placeOtherWrapper");
      bindOtherCheckbox("crop[]", "cropOtherWrapper");
      bindOtherCheckbox("items[]", "itemsOtherWrapper");
      bindOtherCheckbox("material[]", "materialOtherWrapper");
      bindOtherCheckbox("fertilizer[]", "fertilizerOtherWrapper");
    
      // 取得複選框
      function getCheckedValues(name, otherId) {
        let selected = [];
        $("input[name='" + name + "']:checked").each(function () {
          selected.push($(this).val());
        });
        if (selected.includes("其他")) {
          selected = selected.filter(v => v !== "其他");
          selected.push($("#" + otherId).val());
        }
        return selected;
      }
    
      // 清除表單
      function clearForm() {
        $("#materialForm")[0].reset();
        $(".checkbox-group input[type=checkbox]").prop('checked', false);
        $(".other-wrapper").hide().find("input").val("");
        $("#nameOther, #placeOther, #cropOther, #materialOther, #fertilizerOther").hide().val("");
      }
    
      // 填表人選擇其他顯示輸入
      $("#name").change(function () {
        if ($(this).val() === "其他") {
          $("#nameOther").show();
        } else {
          $("#nameOther").hide().val("");
        }
      });
    
      // 下拉選單動畫
      $(".dropbtn").click(function () {
        $(".dropdown-content").not($(this).next()).slideUp(200);
        $(this).next(".dropdown-content").slideToggle(200);
      });
    
      $(document).click(function (event) {
        if (!$(event.target).closest(".dropdown").length) {
          $(".dropdown-content").slideUp(200);
        }
      });
    });
    </script>
    
</body>
