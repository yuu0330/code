<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病蟲害通報表單</title>
    <link rel="stylesheet" href="/static/consult.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body data-page="video">
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_analyze">ICM分析</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">病蟲害諮詢 ▼</button>
                <div class="dropdown-content">
                    <a href="/consult">病蟲害通報</a>
                    <a href="/diagnosis">病蟲害診斷</a>
                </div>
            </div>
            <a href="/daily_trend">每日變化</a>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>
    <div class="stream-container">
        <h2>病蟲害通報</h2>
        <form id="uploadForm">
            <label for="crop">植物名稱：</label>
            <input type="text" id="crop" name="crop" required>

            <label for="name">農民名字：</label>
            <input type="text" id="name" name="name" required>

            <label for="quantity">受害數量：</label>
            <input type="number" id="quantity" name="quantity" required>

            <label for="description">問題描述：</label>
            <textarea id="description" name="description" required></textarea>

            <label for="image">上傳圖片：</label>
            <input type="file" id="image" name="image" accept="image/*" capture="environment" required>

            <div class="submit-wrapper">
                <button type="submit" id="submitBtn">提交</button>
                <button type="button" id="clearForm">清除</button>
            </div>
        </form>

        <!-- <p id="status"></p> -->
    </div>
    <script>
        const form = document.getElementById('uploadForm');
        const statusText = document.getElementById('status');
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwbOXWbEkCkNj2SrMqSUfFQ5JINWUtcKYaErL6Thxj7lg6LS2zJbpO4R0HgEBTuNAKu1g/exec';

        form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusText.textContent = "上傳中...";

        const crop = form.crop.value;
        const name = form.name.value;
        const quantity = form.quantity.value;
        const description = form.description.value;
        const imageFile = form.image.files[0];

        if (!imageFile) return alert("請選擇圖片");

        const reader = new FileReader();
        reader.onloadend = async () => {
            const base64Image = reader.result.split(",")[1];

            const formData = new URLSearchParams();
            formData.append("crop", crop);
            formData.append("name", name);
            formData.append("quantity", quantity);
            formData.append("description", description);
            formData.append("image", base64Image);

            try {
            const response = await fetch(GAS_URL, {
                method: 'POST',
                body: formData,
            });
            const text = await response.text();
            statusText.textContent = text;
            form.reset();
            } catch (err) {
            statusText.textContent = "上傳失敗：" + err.message;
            }
        };
        reader.readAsDataURL(imageFile);
        });
        
        // 清除表單功能
        document.getElementById("clearForm").addEventListener("click", () => {
            form.reset();
            statusText.textContent = "";
        });

        // 確保下拉選單可以展開
        $(document).ready(function () {
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    </script>    
</body>
</html>
