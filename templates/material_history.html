<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史農藥使用紀錄</title>
    <link rel="stylesheet" href="/static/material.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        /* 表格欄位統一設定 */
        #historyTable td, #historyTable th {
            white-space: nowrap;        /* 不換行 */
            overflow: hidden;           /* 超出隱藏 */
            text-overflow: ellipsis;    /* 超出用...顯示 */
            max-width: 200px;           /* 限制最大寬度 */
        }
        
        /* 篩選下拉選單的寬度也限制一下 */
        #historyTable thead select {
            max-width: 100px;
        }
        </style>        
</head>
<body>
    <div class="navbar">
        <a href="/one">
            <img src="/static/標題圖.png" alt="Logo" class="logo">
        </a>   
        <nav>
            <a href="/one">首頁</a>
            <div class="dropdown">
                <button class="dropbtn">害蟲模組 ▼</button>
                <div class="dropdown-content">
                    <a href="/degree">害蟲監測</a>
                    <a href="/degree_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">場域資料 ▼</button>
                <div class="dropdown-content">
                    <a href="/results">環境監測</a>
                    <a href="/results_history">歷史資料</a>
                </div>
            </div>
    
            <div class="dropdown">
                <button class="dropbtn">ICM管理 ▼</button>
                <div class="dropdown-content">
                    <a href="/material">資材紀錄</a>
                    <a href="/material_history">歷史資料</a>
                </div>
            </div>
            <div class="dropdown">
                    <a href="/daily_trend">每日變化</a>
            </div>
            <a href="/video">場域串流</a>
            <a href="/">登出</a>
        </nav>
    </div>

    <div class="content">
        <h2>資材使用紀錄</h2>
        <table id="historyTable" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>填表人</th>
                    <th>使用時間</th>
                    <th>使用地點</th>
                    <th>工作對象農作物</th>
                    <th>工作事項</th>
                    <th>防治資材</th>
                    <th>肥料或益生菌</th>
                    <!-- <th>資材劑量</th>
                    <th>肥料劑量</th> -->
                </tr>
                <tr class="filters">
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th>
                    <!-- <th><select class="filter-select"><option value="">全部</option></select></th>
                    <th><select class="filter-select"><option value="">全部</option></select></th> -->
                </tr>
            </thead>            
            <tbody id="historyTable"></tbody>
        </table>
    </div>

    <script>
        $(document).ready(function () {
            function loadHistory() {
                $.get("/get_materials", function (data) {
                    let historyTable = $("#historyTable tbody");
                    historyTable.empty();
                    data.forEach(record => {
                        historyTable.append(`
                            <tr>
                                <td>${record.name}</td>
                                <td>${record.time}</td>
                                <td>${record.place}</td>
                                <td>${record.crops || '-'}</td>
                                <td>${record.items}</td>
                                <td>${record.material}</td>
                                <td>${record.fertilizer}</td>
                                <!-- <td>${record.materialDose}</td> -->
                                <!-- <td>${record.fertilizerDose}</td> -->
                            </tr>
                        `);
                    });
                    if ($.fn.DataTable.isDataTable("#historyTable")) {
                        $("#historyTable").DataTable().destroy();
                    }

                    let table = $("#historyTable").DataTable({
                        language: {
                            "search": "關鍵字搜尋：",
                            "lengthMenu": "每頁顯示 _MENU_ 筆資料",
                            "zeroRecords": "找不到符合的資料",
                            "info": "顯示第 _START_ 筆到第 _END_ 筆，共 _TOTAL_ 筆",
                            "infoEmpty": "目前沒有資料",
                            "paginate": {
                                "first": "第一頁",
                                "last": "最後一頁",
                                "next": "下一頁",
                                "previous": "上一頁"
                            }
                        },
                        initComplete: function () {
                            this.api().columns().every(function () {
                                var column = this;
                                var select = $('select', column.header());
                                column.data().unique().sort().each(function (d, j) {
                                    if (d && select.find('option[value="' + d + '"]').length === 0) {
                                        select.append('<option value="' + d + '">' + d + '</option>');
                                    }
                                });
                                select.on('change', function () {
                                    var val = $.fn.dataTable.util.escapeRegex($(this).val());
                                    column.search(val ? '^' + val + '$' : '', true, false).draw();
                                });
                            });
                        }
                    });
                });
            }

            loadHistory();
        });
        $(document).ready(function () {
            $(".dropbtn").click(function () {
                $(".dropdown-content").not($(this).next()).slideUp(200);
                $(this).next(".dropdown-content").slideToggle(200);
            });

            $(document).click(function (event) {
                if (!$(event.target).closest(".dropdown").length) {
                    $(".dropdown-content").slideUp(200);
                }
            });
        });
    </script>
</body>
</html>
